<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — SecureLearn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-body">

    <div class="auth-box">
        <div class="auth-logo">
            <div class="auth-logo-icon">🎓</div>
            <span class="auth-logo-text">SecureLearn</span>
        </div>

        <h2 class="auth-title">Welcome back</h2>
        <p class="auth-sub">Sign in to your account to continue</p>

        {% if error %}
        <div class="alert alert-error">⚠ {{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required
                    autocomplete="off" />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required />
            </div>
            <button type="submit" class="btn btn-primary btn-full" style="margin-top:.4rem">Sign In</button>
        </form>

        <div class="divider"></div>
        <p class="auth-footer">Don't have an account? <a href="/register">Register here</a></p>
    </div>

</body>

</html>
