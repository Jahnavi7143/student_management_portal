<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — SecureLearn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-body">

    <div class="auth-box">
        <div class="auth-logo">
            <div class="auth-logo-icon">🎓</div>
            <span class="auth-logo-text">SecureLearn</span>
        </div>

        <h2 class="auth-title">Create Account</h2>
        <p class="auth-sub">Fill in the details below to get started</p>

        {% if error %}
        <div class="alert alert-error">⚠ {{ error }}</div>
        {% endif %}
        {% if success %}
        <div class="alert alert-success">✓ {{ success }}</div>
        {% endif %}

        <form method="POST" action="/register">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required
                    autocomplete="off" />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Choose a password" required />
            </div>
            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" name="role">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-full" style="margin-top:.4rem">Register</button>
        </form>

        <div class="divider"></div>
        <p class="auth-footer">Already have an account? <a href="/login">Login here</a></p>
    </div>

</body>

</html>
