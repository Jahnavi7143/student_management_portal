<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — SecureLearn</title>

    <!-- ✅ REMOVED Google Fonts (fixes ZAP issues) -->

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-body" style="font-family: Arial, sans-serif;">

    <div class="auth-box">
        <div class="auth-logo">
            <div class="auth-logo-icon">🎓</div>
            <span class="auth-logo-text">SecureLearn</span>
        </div>

        <h2 class="auth-title">Create Account</h2>
        <p class="auth-sub">Fill in the details below to get started</p>

        {% if error %}
        <div class="alert alert-error">⚠ {{ error }}</div>
        {% endif %}
        {% if success %}
        <div class="alert alert-success">✓ {{ success }}</div>
        {% endif %}

        <form method="POST" action="/register">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       placeholder="Choose a username" required autocomplete="off" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Choose a password" required />
            </div>

            <button type="submit" class="btn btn-primary btn-full" style="margin-top:.4rem">
                Register
            </button>
        </form>

        <div class="divider"></div>
        <p class="auth-footer">Already have an account? <a href="/login">Login here</a></p>
    </div>

</body>

</html>
