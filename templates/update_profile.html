{% extends "base.html" %}
{% block title %}Update Profile — SecureLearn{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Update Profile</h1>
        <p class="page-sub">Change your account details below</p>
    </div>
</div>

<div class="card" style="max-width:520px">
    <div class="card-header">
        <span class="card-title">✏️ Edit Account</span>
    </div>

    {% if success %}
    <div class="alert alert-success">✓ {{ success }}</div>
    {% endif %}

    <form method="POST" action="/update_profile">

        <!-- 🔐 CSRF FIX -->
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" value="{{ username }}" required />
        </div>

        <div class="form-group">
            <label for="password">New Password</label>
            <!-- 🔐 FIX: no prefill + password type -->
            <input type="password" id="password" name="password" placeholder="Enter new password" required />
        </div>

        <!-- ❌ REMOVED role field (security fix) -->

        <div style="display:flex;gap:.6rem;margin-top:.4rem">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="/dashboard" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
